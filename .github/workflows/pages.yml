name: Publish MANILA FOLDER Privacy Policy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish public privacy policy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout privacy-policy repository
        uses: actions/checkout@v4
      - name: Check privacy policy file
        shell: bash
        run: |
          test -s index.html
          grep -q 'MANILA FOLDER' index.html
          grep -q '개인정보처리방침' index.html
          grep -q '078.5jb@gmail.com' index.html
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload static page
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
